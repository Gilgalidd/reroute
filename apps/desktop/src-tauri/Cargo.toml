[package]
name = "reroute"
description = "Reroute — choose a browser for each link."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "reroute_lib"
# Desktop only. Tauri's template also builds `staticlib` and `cdylib`, which
# only iOS and Android need, at the cost of two more link steps per build.
crate-type = ["rlib"]

[features]
# `tauri build` enables this automatically; pass `--features custom-protocol`
# when building with cargo directly, otherwise the binary loads the dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reroute-core = { workspace = true }
reroute-platform = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
tauri = { version = "2", features = [] }
base64 = "0.23"

[target.'cfg(target_os = "linux")'.dependencies]
# Already built as part of GTK; used only to name the program (see lib.rs).
glib = "0.18"
