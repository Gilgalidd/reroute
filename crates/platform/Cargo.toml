[package]
name = "reroute-platform"
description = "Operating-system integration for Reroute: browser discovery, process launching, default-browser registration and icon loading."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
reroute-core = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
directories = "6"
# One small HTTPS client for the version check. rustls, no OpenSSL.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
icns = "0.5"
core-foundation = "0.10"

[dev-dependencies]
tempfile = { workspace = true }
