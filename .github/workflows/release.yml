name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default. Only the last job may write, and it runs no code
# from the project or its dependencies.
permissions:
  contents: read

jobs:
  checks:
    name: Checks
    # The checks every push to main runs. Nothing is built if one fails.
    uses: ./.github/workflows/ci.yml

  # Building runs the code of many dependencies: build scripts, Vite and its
  # plugins. So this job gets no token that could change the repository or
  # the release, and no cache that another workflow could have filled.
  build:
    name: Installers (${{ matrix.name }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ""
            bundle: target/release/bundle
          - name: windows-x86_64
            os: windows-latest
            args: ""
            bundle: target/release/bundle
          # One universal build: a single .dmg that runs natively on Apple
          # Silicon (M-series) and on Intel Macs.
          - name: macos-universal
            os: macos-latest
            args: "--target universal-apple-darwin"
            bundle: target/universal-apple-darwin/release/bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Rust toolchain (the version pinned in rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          if [ "$RUNNER_OS" = macOS ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi
      - name: Install front-end dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts
      - name: Build the installers
        working-directory: apps/desktop
        shell: bash
        env:
          ARGS: ${{ matrix.args }}
        # $ARGS unquoted on purpose: it holds zero or two words.
        run: npx tauri build $ARGS
      # Fail the release rather than ship a Mac build that will not open:
      # the binary must contain both architectures and the bundle must carry
      # a valid (ad-hoc) signature, which Apple Silicon requires.
      - name: Verify the macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: |
          set -euo pipefail
          check_app() {
            local app="$1" bin="$1/Contents/MacOS/reroute" archs
            archs=" $(lipo -archs "$bin") "
            echo "architectures of $bin:$archs"
            [[ "$archs" == *" arm64 "* && "$archs" == *" x86_64 "* ]] || { echo "::error::$bin is not universal"; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "^(Identifier|Format|Signature)="
          }
          echo "::group::Reroute.app"
          check_app "$BUNDLE/macos/Reroute.app"
          echo "::endgroup::"
          echo "::group::Reroute.app inside the .dmg"
          dmg=$(ls "$BUNDLE"/dmg/*.dmg)
          echo "disk image: $dmg"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          trap 'hdiutil detach "$mnt" >/dev/null || true' EXIT
          check_app "$mnt/Reroute.app"
          echo "::endgroup::"
      - name: Collect the installers
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: |
          set -euo pipefail
          mkdir installers
          case "$RUNNER_OS" in
            Linux) cp "$BUNDLE"/deb/*.deb "$BUNDLE"/rpm/*.rpm "$BUNDLE"/appimage/*.AppImage installers/ ;;
            Windows) cp "$BUNDLE"/msi/*.msi "$BUNDLE"/nsis/*.exe installers/ ;;
            macOS) cp "$BUNDLE"/dmg/*.dmg installers/ ;;
          esac
          ls -l installers
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.name }}
          path: installers/
          if-no-files-found: error

  # Runs only GitHub's own actions and its `gh` tool, never the project's
  # code, so it alone gets the rights to create the release.
  publish:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # sign the build provenance
      attestations: write # store it on GitHub
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: assets
          merge-multiple: true
      # The installers are not signed with a paid certificate: SHA256SUMS
      # tells whether a download is intact, and the provenance attestation
      # that it was built here, from the tagged commit.
      - name: Checksums
        working-directory: assets
        run: sha256sum Reroute* | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          Choose a browser for each link. What changed is listed in [CHANGELOG.md](https://github.com/$GH_REPO/blob/$TAG/CHANGELOG.md).

          | Platform | File |
          |---|---|
          | Debian, Ubuntu | \`Reroute_*_amd64.deb\` |
          | Fedora, openSUSE | \`Reroute-*.x86_64.rpm\` |
          | Any Linux | \`Reroute_*_amd64.AppImage\` |
          | Windows | \`Reroute_*_x64-setup.exe\` or \`Reroute_*_x64_en-US.msi\` |
          | macOS, Apple Silicon (M1 and later) and Intel | \`Reroute_*_universal.dmg\` |

          The installers are not signed with a paid certificate. Windows SmartScreen asks for confirmation. On macOS, open the app once with right-click › Open, or on macOS 15 and later click *Open Anyway* in System Settings › Privacy & Security.

          To check a download, compare it with \`SHA256SUMS\`: \`sha256sum -c SHA256SUMS --ignore-missing\` on Linux, \`shasum -a 256 -c SHA256SUMS --ignore-missing\` on macOS, \`Get-FileHash <file>\` in PowerShell. To check that it was built by this repository's release workflow, from the tagged commit: \`gh attestation verify <file> --repo $GH_REPO\`.
          NOTES
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --draft --verify-tag "${prerelease[@]}" \
            --title "Reroute $TAG" --notes-file notes.md assets/*
