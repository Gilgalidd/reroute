name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; only the jobs that write the draft release get more.
permissions:
  contents: read

jobs:
  checks:
    name: Checks
    # The checks every push to main runs. Nothing is built if one fails.
    uses: ./.github/workflows/ci.yml

  build:
    name: Installers (${{ matrix.name }})
    needs: checks
    permissions:
      contents: write # upload the installers to the draft release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ""
          - name: windows-x86_64
            os: windows-latest
            args: ""
          # One universal build: a single .dmg that runs natively on Apple
          # Silicon (M-series) and on Intel Macs.
          - name: macos-universal
            os: macos-latest
            args: "--target universal-apple-darwin"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Rust toolchain (the version pinned in rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          if [ "$RUNNER_OS" = macOS ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install front-end dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Reroute ${{ github.ref_name }}
          releaseBody: |
            Choose a browser for each link. What changed is listed in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).

            | Platform | File |
            |---|---|
            | Debian, Ubuntu | `Reroute_*_amd64.deb` |
            | Fedora, openSUSE | `Reroute-*.x86_64.rpm` |
            | Any Linux | `Reroute_*_amd64.AppImage` |
            | Windows | `Reroute_*_x64-setup.exe` or `Reroute_*_x64_en-US.msi` |
            | macOS, Apple Silicon (M1 and later) and Intel | `Reroute_*_universal.dmg` |

            The installers are not signed with a paid certificate. Windows SmartScreen asks for confirmation. On macOS, open the app once with right-click › Open, or on macOS 15 and later click *Open Anyway* in System Settings › Privacy & Security.

            To check a download, compare it with `SHA256SUMS`: `sha256sum -c SHA256SUMS --ignore-missing` on Linux, `shasum -a 256 -c SHA256SUMS --ignore-missing` on macOS, `Get-FileHash <file>` in PowerShell.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
      # Fail the release rather than ship a Mac build that will not open:
      # the binary must contain both architectures and the bundle must carry
      # a valid (ad-hoc) signature, which Apple Silicon requires.
      - name: Verify the macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle=target/universal-apple-darwin/release/bundle
          check_app() {
            local app="$1" bin="$1/Contents/MacOS/reroute" archs
            archs=" $(lipo -archs "$bin") "
            echo "architectures of $bin:$archs"
            [[ "$archs" == *" arm64 "* && "$archs" == *" x86_64 "* ]] || { echo "::error::$bin is not universal"; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "^(Identifier|Format|Signature)="
          }
          echo "::group::Reroute.app"
          check_app "$bundle/macos/Reroute.app"
          echo "::endgroup::"
          echo "::group::Reroute.app inside the .dmg"
          dmg=$(ls "$bundle"/dmg/*.dmg)
          echo "disk image: $dmg"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          trap 'hdiutil detach "$mnt" >/dev/null || true' EXIT
          check_app "$mnt/Reroute.app"
          echo "::endgroup::"

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # add SHA256SUMS to the draft release
    steps:
      # The installers are not signed with a paid certificate, so a list of
      # their SHA-256 sums is the way to check that a download is intact.
      - name: Publish SHA256SUMS beside the installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir assets && cd assets
          gh release download "$TAG" --pattern 'Reroute*'
          sha256sum Reroute* | tee SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
