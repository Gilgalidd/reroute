[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Gilgalidd/reroute"
authors = ["Reroute contributors"]

[workspace.dependencies]
reroute-core = { path = "crates/core" }
reroute-platform = { path = "crates/platform" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"

# dev
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
