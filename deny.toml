# cargo-deny configuration: supply-chain policy enforced in CI.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Signpost must never talk to the network; refuse HTTP clients outright.
deny = [
    { crate = "reqwest", reason = "Signpost has a zero-network policy" },
    { crate = "hyper", reason = "Signpost has a zero-network policy" },
    { crate = "ureq", reason = "Signpost has a zero-network policy" },
    { crate = "openssl", reason = "Signpost has a zero-network policy" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
