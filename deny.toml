# cargo-deny configuration: supply-chain policy enforced in CI.
[graph]
all-features = true
# Reroute ships on desktop only. Restricting the graph to these targets keeps
# mobile-only dependencies of Tauri (e.g. its HTTP client) out of the audit.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates deep inside Tauri's tree are Tauri's call; only our own
# direct dependencies must be maintained.
unmaintained = "workspace"
ignore = [
    # glib 0.18 is the version GTK 3 uses, and GTK 3 is Tauri's Linux backend,
    # so the crate is in the binary whether Reroute names it or not. Reroute
    # calls only `glib::set_prgname` (apps/desktop/src-tauri/src/lib.rs) and
    # never iterates a GVariant, where the unsound code is. The fix starts at
    # glib 0.20, which the GTK 3 bindings will not move to. Remove this entry
    # when Tauri's Linux backend leaves GTK 3.
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 comes with GTK 3; Reroute uses set_prgname only, never VariantStrIter" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    # Data licence of the Mozilla CA root store used to verify TLS.
    "CDLA-Permissive-2.0",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Reroute reaches the network in exactly one place: the version check in
# `reroute-platform`. Its small client is allowed there and nowhere else, and
# every other HTTP client stays banned.
deny = [
    { crate = "ureq", wrappers = ["reroute-platform"], reason = "only the version check may reach the network" },
    { crate = "reqwest", reason = "Reroute needs no second HTTP client" },
    { crate = "hyper", reason = "Reroute needs no second HTTP client" },
    { crate = "openssl", reason = "TLS goes through rustls; no OpenSSL in the graph" },
    { crate = "native-tls", reason = "TLS goes through rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
