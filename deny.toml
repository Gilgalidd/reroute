# cargo-deny configuration: supply-chain policy enforced in CI.
[graph]
all-features = true
# Reroute ships on desktop only. Restricting the graph to these targets keeps
# mobile-only dependencies of Tauri (e.g. its HTTP client) out of the audit.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates deep inside Tauri's tree are Tauri's call; only our own
# direct dependencies must be maintained.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Reroute must never talk to the network; refuse HTTP clients outright.
deny = [
    { crate = "reqwest", reason = "Reroute has a zero-network policy" },
    { crate = "hyper", reason = "Reroute has a zero-network policy" },
    { crate = "ureq", reason = "Reroute has a zero-network policy" },
    { crate = "openssl", reason = "Reroute has a zero-network policy" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
